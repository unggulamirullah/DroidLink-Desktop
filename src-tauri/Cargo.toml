[package]
name = "droidlink-desktop"
version = "0.1.0"
description = "Android device mirroring and control desktop application"
authors = ["DroidLink Desktop"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "droidlink_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "sync", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

